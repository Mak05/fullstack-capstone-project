version: '3.9'

services:
  backend:
    build: ./project/blob/main/backend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      JWT_SECRET: secretkey123
    depends_on:
      - mongo

  frontend:
    build: ./project/blob/main/frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
